name: Actualizar Dashboard

on:
  workflow_dispatch: # Permite ejecutarlo manualmente si lo deseas
  push:
    paths:
      - 'data/data.ods' # ⚡ ¡NUEVO! Se ejecuta automáticamente cada vez que subas/reemplaces data.ods

jobs:
  generar-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Script
        run: python generador_dashboard.py

      - name: Mover HTML a la carpeta public
        run: |
          mkdir -p public
          mv dashboard_conectividad.html public/index.html

      - name: Subir cambios a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/historial.json public/index.html
          git commit -m "Actualizar historial y dashboard automáticamente" || echo "No hay cambios para guardar"
          git push
