name: Actualizar Historial de Telemetria

on:
  push:
    branches:
      - main
    paths:
      - 'data/data.ods'
  workflow_dispatch:

jobs:
  procesar-datos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas odfpy 

    - name: Ejecutar script de Python
      run: python generador_dashboard.py

    - name: Subir cambios a GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Actualizar historial y dashboard automáticamente" || echo "No changes to commit"
        git pull --rebase origin main
        git push
