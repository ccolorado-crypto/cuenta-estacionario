name: Actualizar Historial de Telemetria

on:
  push:
    branches:
      - main
    paths:
      - 'data/data.ods' # El robot solo se activará si este archivo específico cambia

jobs:
  procesar-datos:
    runs-on: ubuntu-latest
    
    # Estos permisos son necesarios para que el robot pueda guardar archivos
    permissions:
      contents: write 

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # Aquí se instalan las librerías. Si usas requirements.txt, cámbialo por: pip install -r requirements.txt
        pip install pandas odfpy 

    - name: Ejecutar script de Python
      # IMPORTANTE: Asegúrate de que "script.py" sea el nombre real de tu archivo Python. Si se llama diferente (ej. main.py), cámbialo aquí.
      run: python script.py 

    - name: Subir cambios a GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Actualizar historial y dashboard automáticamente" || echo "No changes to commit"
        
        # Esta es la línea mágica que evita el error rojo de sincronización
        git pull --rebase origin main
        
        git push
